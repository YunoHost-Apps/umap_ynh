# https://yunohost.org/en/packaging_manifest
packaging_format = 2

id = "umap"
name = "uMap"
description.en = "Create maps with OpenStreetMap layers in a minute and embed them in your site"
description.fr = "Créer des cartes personnalisées sur des fonds OpenStreetMap en un instant et les afficher dans votre site"

version = "3.6.1~ynh1"

maintainers = ["Yohan Boniface", "David Larlet"]


[upstream]
# https://yunohost.org/en/packaging_manifest#upstream-section
license = "AGPL-3.0-only"
website = "https://umap-project.org/"
demo = "https://dev.umap-project.org/"
admindoc = "https://docs.umap-project.org/en/stable/"
userdoc = "https://discover.umap-project.org/"
code = "https://github.com/umap-project/umap"

[integration]
# https://yunohost.org/en/packaging_manifest#integration-section
yunohost = ">=12.1.17"
helpers_version = "2.1" # https://yunohost.org/en/packaging_apps_helpers_v2.1
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "500M"
ram.build = "250M"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/umap"

    [install.admin]
    type = "user"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.realtime]
    ask.en = "Enable realtime collaboration?"
    type = "boolean"
    default = 1

    [install.allow_anonymous]
    ask.en = "Allow non logged in users to create maps?"
    type = "boolean"
    default = 0


[resources]

    [resources.sources.main]
    url = "https://github.com/umap-project/umap/archive/refs/tags/3.6.1.tar.gz"
    sha256 = "2f8b3c24dfc940a780943d14f901a2434e218d455577e37bf3039448533018f1"

    # Only here to bump the package version
    prefetch = false

    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x" # static files served by nginx

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    # These rules are just meant to let Yunohost redirect to the login page
    login.url = "re:/[a-z]*/login/?"
    login.show_tile = false
    login.allowed = "all_users"

    [resources.ports]
    main.default = 8000

    [resources.apt]
    packages = "python3, python3-pip, python3-venv, libpq-dev, postgresql, postgresql-contrib, redis-server, postgis"

    [resources.database]
    type = "postgresql"
