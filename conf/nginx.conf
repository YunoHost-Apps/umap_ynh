    # Gunicorn proxy
    location / {

        proxy_pass http://127.0.0.1:__PORT__;
        include proxy_params_no_auth;
        proxy_redirect off;
        proxy_buffering off;
        client_max_body_size 10G;
    }

    # Static files
    location /static/ {
        alias __INSTALL_DIR__/static/;
        expires 1y;
        more_set_headers "Cache-Control: public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias __INSTALL_DIR__/media/;
        expires 1y;
        access_log off;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ ^/(\.env|\.git|\.ht|README\.md|requirements\.txt|manage\.py) {
        deny all;
        access_log off;
        log_not_found off;
}
